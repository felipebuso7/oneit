name: oneit-foundation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.foundation
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - oneit_postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [private]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    env_file:
      - .env.foundation
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - oneit_minio_data:/data
    networks: [private]

  identity:
    image: quay.io/keycloak/keycloak:26.1.0
    restart: unless-stopped
    env_file:
      - .env.foundation
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
      - --metrics-enabled=true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

volumes:
  oneit_postgres_data:
  oneit_minio_data:

networks:
  private:
    internal: true
