name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:release-tree
      - run: npm run audit:migrations:strict
      - run: npm run lint:stabilization
      - run: npm run lint:field-service
      - run: npm run lint:core-ui
      - run: npm run lint:finance
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate production container build
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci.invalid.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
          --tag oneit-ci:${{ github.sha }} .

  database_migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh local Supabase database
        run: npx supabase start
      - name: Inspect billing privileges on the fresh database
        env:
          # Supabase CLI's disposable local database; never a cloud credential.
          ONEIT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run audit:billing-db
